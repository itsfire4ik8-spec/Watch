<!DOCTYPE html>
<html lang="ru" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minimal iPad Clock</title>
    
    <!-- iOS PWA Meta Tags for Standalone Web App Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clock">
    <meta name="theme-color" content="#000000">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for sleek minimal typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@200;300;400;600&family=JetBrains+Mono:ital,wght@0,200;0,400;0,700;1,100&family=Montserrat:wght@100;200;300;500&display=swap" rel="stylesheet">

    <style>
        /* Typography Presets */
        .font-sans-clean { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
        .font-serif-chic { font-family: 'Cinzel', serif; }
        .font-ultra-light { font-family: 'Montserrat', sans-serif; }

        /* Custom glow effects for themes */
        .glow-cyan {
            text-shadow: 0 0 25px rgba(6, 182, 212, 0.4), 0 0 50px rgba(6, 182, 212, 0.2);
        }
        .glow-amber {
            text-shadow: 0 0 25px rgba(245, 158, 11, 0.4), 0 0 50px rgba(245, 158, 11, 0.2);
        }
        .glow-white {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        /* Smooth UI transitions for auto-hiding controls */
        .ui-fade {
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Prevent text selection and webkit callouts */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        /* Night Mode dimming overlay */
        .night-dim {
            opacity: 0.25 !important;
            filter: grayscale(0.5);
        }

        /* Blinking colon animation */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .colon-blink {
            animation: pulse-soft 2s infinite ease-in-out;
        }
    </style>
</head>

<body id="appBody" class="h-full w-full bg-black text-white overflow-hidden flex flex-col justify-between p-6 sm:p-10 font-sans-clean relative transition-colors duration-700">

    <!-- Subtle Background Ambient Glow (for Cyberpunk/Neon themes) -->
    <div id="ambientLight" class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-1000 bg-radial from-cyan-900/20 via-transparent to-transparent"></div>

    <!-- Header / Top Bar Info -->
    <header id="topBar" class="w-full flex justify-between items-start z-10 ui-fade pt-2">
        <div class="flex flex-col">
            <span id="dayName" class="text-xs sm:text-sm tracking-[0.3em] uppercase text-zinc-400 font-light">ПОНЕДЕЛЬНИК</span>
            <span id="fullDate" class="text-sm sm:text-base font-normal text-zinc-200 mt-0.5">12 СЕНТЯБРЯ</span>
        </div>

        <div class="flex items-center gap-3 text-xs tracking-wider text-zinc-400">
            <!-- Week Number -->
            <span id="weekNum" class="hidden sm:inline-block bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-full">НЕДЕЛЯ 37</span>
            <!-- Battery Indicator (if supported) -->
            <div id="batteryContainer" class="hidden flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full">
                <svg class="w-3.5 h-3.5 text-zinc-400" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 6a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
                    <path fill-rule="evenodd" d="M17 8a1 1 0 011-1h1a1 1 0 011 1v4a1 1 0 01-1 1h-1a1 1 0 01-1-1V8z" clip-rule="evenodd"></path>
                </svg>
                <span id="batteryLevel">--%</span>
            </div>
        </div>
    </header>

    <!-- Main Center Clock Display (Optimized for Portrait Screen) -->
    <main id="clockContainer" class="my-auto flex flex-col items-center justify-center z-10 cursor-pointer w-full">
        
        <!-- Big Digits Container -->
        <div id="timeWrapper" class="flex flex-col items-center justify-center leading-none tracking-tighter">
            <!-- Hours -->
            <div id="hours" class="text-[28vw] sm:text-[22vw] font-extralight tracking-tight text-white transition-all duration-300">
                12
            </div>
            
            <!-- Minimal Divider / Blinking Indicator -->
            <div id="timeDivider" class="h-2 w-16 my-4 sm:my-6 rounded-full bg-zinc-800 transition-all duration-500"></div>

            <!-- Minutes -->
            <div id="minutes" class="text-[28vw] sm:text-[22vw] font-extralight tracking-tight text-zinc-300 transition-all duration-300">
                45
            </div>
        </div>

        <!-- Seconds & Sub-info Row -->
        <div class="mt-6 flex items-center gap-3 text-zinc-400">
            <span id="seconds" class="text-xl sm:text-2xl font-mono-tech font-light tracking-widest text-zinc-500">59</span>
            <span id="ampm" class="text-xs font-semibold uppercase tracking-widest text-zinc-600 hidden">AM</span>
        </div>

        <!-- Dynamic Greeting Quote -->
        <div id="greetingText" class="mt-8 text-xs sm:text-sm tracking-[0.25em] text-zinc-500 uppercase font-light text-center px-4">
            ДОБРЫЙ ВЕЧЕР
        </div>

        <!-- Minute Progress Bar -->
        <div class="w-48 sm:w-64 h-[2px] bg-zinc-900 rounded-full mt-6 overflow-hidden">
            <div id="minuteProgress" class="h-full bg-zinc-500 transition-all duration-1000 w-1/2"></div>
        </div>
    </main>

    <!-- Floating Bottom Controls Toolbar -->
    <footer id="bottomBar" class="w-full flex flex-col items-center gap-4 z-20 ui-fade pb-2">
        <div class="flex items-center gap-2 sm:gap-3 bg-zinc-900/80 backdrop-blur-md p-2 rounded-2xl border border-zinc-800/80 shadow-2xl">
            <!-- Toggle Theme Button -->
            <button id="themeBtn" title="Сменить тему" class="p-3 rounded-xl bg-zinc-800/60 hover:bg-zinc-700 text-zinc-300 active:scale-95 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                </svg>
            </button>

            <!-- Toggle Font Style Button -->
            <button id="fontBtn" title="Сменить шрифт" class="p-3 rounded-xl bg-zinc-800/60 hover:bg-zinc-700 text-zinc-300 active:scale-95 transition-all font-serif">
                <span class="text-sm font-semibold">Aa</span>
            </button>

            <!-- Night Dim Toggle -->
            <button id="nightBtn" title="Ночной режим" class="p-3 rounded-xl bg-zinc-800/60 hover:bg-zinc-700 text-zinc-300 active:scale-95 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>

            <!-- Toggle Seconds Button -->
            <button id="secBtn" title="Показать/скрыть секунды" class="px-3.5 py-2.5 rounded-xl bg-zinc-800/60 hover:bg-zinc-700 text-zinc-300 text-xs font-mono font-medium active:scale-95 transition-all">
                :SS
            </button>

            <!-- Toggle 12h/24h Format -->
            <button id="formatBtn" title="12/24 формата" class="px-3 py-2.5 rounded-xl bg-zinc-800/60 hover:bg-zinc-700 text-zinc-300 text-xs font-bold active:scale-95 transition-all">
                24H
            </button>
        </div>

        <p class="text-[10px] text-zinc-600 tracking-wider">Нажми в любое место, чтобы скрыть панели</p>
    </footer>

    <script>
        // Configuration & State
        const state = {
            is24Hour: true,
            showSeconds: true,
            themeIndex: 0,
            fontIndex: 0,
            isNightMode: false,
            uiVisible: true,
            hideTimeout: null
        };

        // Theme Definitions
        const themes = [
            {
                name: 'OLED Black',
                bg: 'bg-black',
                hours: 'text-white',
                minutes: 'text-zinc-400',
                divider: 'bg-zinc-800',
                glow: '',
                accent: 'bg-zinc-500'
            },
            {
                name: 'Cyberpunk Neon',
                bg: 'bg-slate-950',
                hours: 'text-cyan-400 glow-cyan',
                minutes: 'text-cyan-200/80',
                divider: 'bg-cyan-500/50 shadow-cyan-500/50 shadow-lg',
                glow: 'opacity-100',
                accent: 'bg-cyan-400'
            },
            {
                name: 'Warm Amber',
                bg: 'bg-zinc-950',
                hours: 'text-amber-500 glow-amber',
                minutes: 'text-amber-200/70',
                divider: 'bg-amber-600/50',
                glow: 'opacity-40',
                accent: 'bg-amber-500'
            },
            {
                name: 'Minimal Light',
                bg: 'bg-zinc-100',
                hours: 'text-zinc-900',
                minutes: 'text-zinc-500',
                divider: 'bg-zinc-300',
                glow: 'opacity-0',
                accent: 'bg-zinc-800'
            }
        ];

        // Font Class Definitions
        const fonts = [
            'font-sans-clean',
            'font-mono-tech',
            'font-serif-chic',
            'font-ultra-light'
        ];

        // DOM Elements
        const appBody = document.getElementById('appBody');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const ampmEl = document.getElementById('ampm');
        const timeDivider = document.getElementById('timeDivider');
        const dayNameEl = document.getElementById('dayName');
        const fullDateEl = document.getElementById('fullDate');
        const weekNumEl = document.getElementById('weekNum');
        const greetingText = document.getElementById('greetingText');
        const minuteProgress = document.getElementById('minuteProgress');
        const topBar = document.getElementById('topBar');
        const bottomBar = document.getElementById('bottomBar');
        const clockContainer = document.getElementById('clockContainer');
        const ambientLight = document.getElementById('ambientLight');

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            // Handle 12/24 hour format
            if (!state.is24Hour) {
                const isPm = h >= 12;
                ampmEl.textContent = isPm ? 'PM' : 'AM';
                ampmEl.classList.remove('hidden');
                h = h % 12 || 12;
            } else {
                ampmEl.classList.add('hidden');
            }

            // String formatting with padStart
            const hoursStr = String(h).padStart(2, '0');
            const minutesStr = String(m).padStart(2, '0');
            const secondsStr = String(s).padStart(2, '0');

            if (hoursEl.textContent !== hoursStr) hoursEl.textContent = hoursStr;
            if (minutesEl.textContent !== minutesStr) minutesEl.textContent = minutesStr;
            secondsEl.textContent = secondsStr;

            // Update Minute Progress Bar (0 to 100%)
            const progressPercent = ((s / 60) * 100).toFixed(1);
            minuteProgress.style.width = `${progressPercent}%`;

            // Update Date strings periodically (or once per frame)
            const daysRu = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
            const monthsRu = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];

            dayNameEl.textContent = daysRu[now.getDay()];
            fullDateEl.textContent = `${now.getDate()} ${monthsRu[now.getMonth()]}`;

            // Calculate Week Number
            const startOfYear = new Date(now.getFullYear(), 0, 1);
            const pastDaysOfYear = (now - startOfYear) / 86400000;
            const weekNum = Math.ceil((pastDaysOfYear + startOfYear.getDay() + 1) / 7);
            weekNumEl.textContent = `НЕДЕЛЯ ${weekNum}`;

            // Dynamic Greeting
            const rawH = now.getHours();
            if (rawH >= 5 && rawH < 12) greetingText.textContent = 'ДОБРОЕ УТРО';
            else if (rawH >= 12 && rawH < 18) greetingText.textContent = 'ДОБРЫЙ ДЕНЬ';
            else if (rawH >= 18 && rawH < 23) greetingText.textContent = 'ДОБРЫЙ ВЕЧЕР';
            else greetingText.textContent = 'ДОБРОЙ НОЧИ';
        }

        function applyTheme() {
            const theme = themes[state.themeIndex];

            // Reset background classes
            appBody.className = `h-full w-full ${theme.bg} overflow-hidden flex flex-col justify-between p-6 sm:p-10 ${fonts[state.fontIndex]} relative transition-colors duration-700`;
            
            // Adjust light text vs dark text for Minimal Light theme
            if (state.themeIndex === 3) {
                appBody.classList.remove('text-white');
                appBody.classList.add('text-zinc-900');
                dayNameEl.className = "text-xs sm:text-sm tracking-[0.3em] uppercase text-zinc-500 font-light";
                fullDateEl.className = "text-sm sm:text-base font-normal text-zinc-800 mt-0.5";
                greetingText.className = "mt-8 text-xs sm:text-sm tracking-[0.25em] text-zinc-500 uppercase font-light text-center px-4";
                secondsEl.className = "text-xl sm:text-2xl font-mono-tech font-light tracking-widest text-zinc-600";
            } else {
                appBody.classList.add('text-white');
                dayNameEl.className = "text-xs sm:text-sm tracking-[0.3em] uppercase text-zinc-400 font-light";
                fullDateEl.className = "text-sm sm:text-base font-normal text-zinc-200 mt-0.5";
                greetingText.className = "mt-8 text-xs sm:text-sm tracking-[0.25em] text-zinc-500 uppercase font-light text-center px-4";
                secondsEl.className = "text-xl sm:text-2xl font-mono-tech font-light tracking-widest text-zinc-500";
            }

            hoursEl.className = `text-[28vw] sm:text-[22vw] font-extralight tracking-tight transition-all duration-300 ${theme.hours}`;
            minutesEl.className = `text-[28vw] sm:text-[22vw] font-extralight tracking-tight transition-all duration-300 ${theme.minutes}`;
            timeDivider.className = `h-2 w-16 my-4 sm:my-6 rounded-full transition-all duration-500 ${theme.divider}`;
            minuteProgress.className = `h-full transition-all duration-1000 ${theme.accent}`;

            if (theme.glow) {
                ambientLight.className = `absolute inset-0 pointer-events-none transition-opacity duration-1000 bg-radial from-cyan-600/15 via-transparent to-transparent ${theme.glow}`;
            } else {
                ambientLight.className = "absolute inset-0 pointer-events-none opacity-0";
            }
        }

        function toggleUI(show) {
            state.uiVisible = show !== undefined ? show : !state.uiVisible;
            if (state.uiVisible) {
                topBar.style.opacity = '1';
                topBar.style.transform = 'translateY(0)';
                bottomBar.style.opacity = '1';
                bottomBar.style.transform = 'translateY(0)';
                resetAutoTimeout();
            } else {
                topBar.style.opacity = '0';
                topBar.style.transform = 'translateY(-20px)';
                bottomBar.style.opacity = '0';
                bottomBar.style.transform = 'translateY(20px)';
            }
        }

        function resetAutoTimeout() {
            clearTimeout(state.hideTimeout);
            state.hideTimeout = setTimeout(() => {
                toggleUI(false);
            }, 5000); // Auto hide toolbar after 5 seconds of inactivity
        }

        // Tap screen to show/hide controls
        document.addEventListener('click', (e) => {
            // Ignore button clicks inside footer toolbar
            if (e.target.closest('#bottomBar')) return;
            toggleUI();
        });

        document.getElementById('themeBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            state.themeIndex = (state.themeIndex + 1) % themes.length;
            applyTheme();
            resetAutoTimeout();
        });

        document.getElementById('fontBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            state.fontIndex = (state.fontIndex + 1) % fonts.length;
            applyTheme();
            resetAutoTimeout();
        });

        document.getElementById('nightBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            state.isNightMode = !state.isNightMode;
            if (state.isNightMode) {
                clockContainer.classList.add('night-dim');
                topBar.classList.add('night-dim');
            } else {
                clockContainer.classList.remove('night-dim');
                topBar.classList.remove('night-dim');
            }
            resetAutoTimeout();
        });

        document.getElementById('secBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            state.showSeconds = !state.showSeconds;
            secondsEl.style.display = state.showSeconds ? 'inline' : 'none';
            resetAutoTimeout();
        });

        document.getElementById('formatBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            state.is24Hour = !state.is24Hour;
            e.currentTarget.textContent = state.is24Hour ? '24H' : '12H';
            updateClock();
            resetAutoTimeout();
        });

        if ('getBattery' in navigator) {
            navigator.getBattery().then((battery) => {
                const container = document.getElementById('batteryContainer');
                const levelEl = document.getElementById('batteryLevel');
                container.classList.remove('hidden');

                function updateBattery() {
                    levelEl.textContent = `${Math.round(battery.level * 100)}%`;
                }
                updateBattery();
                battery.addEventListener('levelchange', updateBattery);
            }).catch(() => {});
        }

        window.onload = function () {
            updateClock();
            applyTheme();
            setInterval(updateClock, 1000);
            resetAutoTimeout();
        };
    </script>
</body>
</html>
